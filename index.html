<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
  <ul class="todo-list">

    <li>
      <input type="checkbox" id="workout">
      <label for="workout">Workout</label>
      <ul class="sub-item">
        <li><a href="https://apex-cp2cwb5gi-mathis-projects9.vercel.app" target="_blank" class="sub-item-link">Go to the gym for an hour.</a></li>
      </ul>
    </li>

    <li>
      <input type="checkbox" id="business">
      <label for="business">Business</label>
      <ul class="sub-item">
        <li><a href="https://claude.ai/login" target="_blank" class="sub-item-link">Design a premium website for a client and continue to work on digital products.</a></li>
      </ul>
    </li>

    <li>
      <input type="checkbox" id="football">
      <label for="football">Football</label>
      <ul class="sub-item">
        <li><a href="https://www.youtube.com/watch?v=5yk3Gd2arzI" target="_blank" class="sub-item-link">Train technical ability and skills for wingers.</a></li>
      </ul>
    </li>

    <li>
      <input type="checkbox" id="bible-study">
      <label for="bible-study">Bible Study</label>
      <ul class="sub-item">
        <li><a href="https://www.youversion.com/bible-app" target="_blank" class="sub-item-link">Read and meditate on the word of God.</a></li>
      </ul>
    </li>

  </ul>

</body>

</html>
