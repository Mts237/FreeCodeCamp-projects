<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
  <ul class="todo-list">

    <li>
      <input type="checkbox" id="workout">
      <label for="workout">Workout</label>
      <ul class="sub-item">
        <li><a href="https://www.puregym.swiss" target="_blank" class="sub-item-link">Go to the gym and train for an hour.</a></li>
      </ul>
    </li>

    <li>
      <input type="checkbox" id="coding">
      <label for="coding">Coding</label>
      <ul class="sub-item">
        <li><a href="https://www.freecodecamp.org" target="_blank" class="sub-item-link">Finish freeCodeCamp project</a></li>
      </ul>
    </li>

    <li>
      <input type="checkbox" id="football">
      <label for="football">Football</label>
      <ul class="sub-item">
        <li><a href="https://www.youtube.com/watch?v=W-OlqudP3WU" target="_blank" class="sub-item-link">Train weak foot and finishing.</a></li>
      </ul>
    </li>

    <li>
      <input type="checkbox" id="reading">
      <label for="reading">Reading</label>
      <ul class="sub-item">
        <li><a href="https://payot.ch" target="_blank" class="sub-item-link">Read at least 10 pages of a book.</a></li>
      </ul>
    </li>

  </ul>

</body>

</html>
